<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C786" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#9A752F" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#123D32" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crest: Peacock Feather Crown & Flute Motif -->
  <g transform="translate(250, 42) scale(0.9)" filter="url(#subtleGlow)">
    <!-- Crown Diadem Base -->
    <path d="M-28 6 C-12 10, 12 10, 28 6 C24 1, 14 3, 0 3 C-14 3, -24 1, -28 6 Z" fill="url(#goldGrad)" />
    <!-- Three Crown Peaks with Pearl/Gem Orbs -->
    <path d="M-22 5 C-18 -4, -14 -12, -15 -18 C-12 -12, -9 -4, -7 5 Z" fill="url(#goldGrad)" />
    <path d="M-7 4 C-4 -8, -1 -22, 0 -26 C1 -22, 4 -8, 7 4 Z" fill="url(#goldGrad)" />
    <path d="M7 5 C9 -4, 12 -12, 15 -18 C14 -12, 18 -4, 22 5 Z" fill="url(#goldGrad)" />
    <!-- Center Jewel Orb -->
    <circle cx="0" cy="-28" r="2.5" fill="url(#goldGrad)" />
    <circle cx="-15" cy="-20" r="1.8" fill="url(#goldGrad)" />
    <circle cx="15" cy="-20" r="1.8" fill="url(#goldGrad)" />

    <!-- Stylized Morpankh (Peacock Feather) rising above the crown -->
    <path d="M0 -26 C-7 -38, -16 -46, -12 -58 C-8 -70, 0 -76, 0 -76 C0 -76, 8 -70, 12 -58 C16 -46, 7 -38, 0 -26 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <!-- Inner Feather Eye (Chandrika) -->
    <ellipse cx="0" cy="-56" rx="5" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="0" cy="-56" r="2.5" fill="url(#goldGrad)" />
    <!-- Feather vanes/radiations -->
    <path d="M-4 -48 C-10 -50, -18 -46, -22 -41" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M-7 -56 C-15 -58, -22 -55, -25 -50" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M-6 -64 C-13 -68, -18 -66, -20 -60" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M4 -48 C10 -50, 18 -46, 22 -41" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M7 -56 C15 -58, 22 -55, 25 -50" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M6 -64 C13 -68, 18 -66, 20 -60" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark: RADHA JEWELLERS -->
  <text x="250" y="88" text-anchor="middle" font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" letter-spacing="4" fill="url(#goldGrad)">
    RADHA JEWELLERS
  </text>

  <!-- Divider flourishes -->
  <path d="M140 102 L200 102 M300 102 L360 102" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
  <circle cx="206" cy="102" r="1.5" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="294" cy="102" r="1.5" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Subtitle: SINCE 2003 -->
  <text x="250" y="105" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" letter-spacing="5" fill="url(#goldGrad)">
    SINCE 2003
  </text>
  
  <!-- Location mark: HATA, KUSHINAGAR -->
  <text x="250" y="122" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="400" letter-spacing="3" fill="url(#goldGrad)" opacity="0.85">
    HATA • KUSHINAGAR
  </text>
</svg>

